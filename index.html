<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BURIED DESTINY</title>
<meta name="description" content="Buried Destiny. Zip hoodie. $10 shipped.">
<style>
  :root{
    --bg:#E7E5E1;
    --ink:#1a1a1a;
    --mute:#8f8d89;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    letter-spacing:.12em;
    -webkit-font-smoothing:antialiased;
  }
  .line-name{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.34em;
    margin-bottom:40px;
    color:var(--ink);
  }
  main{
    width:100%;
    max-width:640px;
    padding:48px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .product{
    width:100%;
  }
  .product img{
    width:100%;
    display:block;
    mix-blend-mode:multiply;
  }
  h1{
    font-size:12px;
    font-weight:400;
    text-transform:uppercase;
    margin-top:36px;
  }
  .price{
    font-size:12px;
    color:var(--mute);
    text-transform:uppercase;
    margin-top:10px;
  }
  .group{
    margin-top:34px;
    width:100%;
  }
  .group-label{
    font-size:10px;
    color:var(--mute);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .opts{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .opt{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    background:transparent;
    color:var(--ink);
    border:1px solid transparent;
    padding:12px 18px;
    min-width:56px;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;
  }
  .opt:hover{border-color:var(--ink)}
  .opt[aria-pressed="true"]{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .opt:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .email-input{
    width:100%;
    max-width:420px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink);
    padding:16px 18px;
    text-align:center;
    outline:none;
  }
  .email-input::placeholder{color:var(--mute)}
  .email-input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .fields{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .field-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:420px;
  }
  .field-row .email-input{min-width:0;flex:1}
  .country-select{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%231a1a1a'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  .country-select:invalid{color:var(--mute)}
  .field-hint{
    font-size:9px;
    color:var(--mute);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:10px;
  }
  .buy{
    display:block;
    width:100%;
    margin-top:44px;
    padding:20px;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bg);
    background:var(--ink);
    transition:opacity .15s;
  }
  .buy:hover{opacity:.85}
  .buy:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .note{
    margin-top:22px;
    font-size:10px;
    line-height:2;
    color:var(--mute);
    text-transform:uppercase;
    max-width:420px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px 20px;
    width:100%;
    margin-top:8px;
  }
  @media (max-width:520px){ .grid{grid-template-columns:1fr;gap:34px} }
  .card{
    background:none;border:0;padding:0;margin:0;
    font:inherit;color:inherit;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;
  }
  .card img{width:100%;display:block;mix-blend-mode:multiply;transition:opacity .15s}
  .card:hover img{opacity:.82}
  .card:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
  .card-name{
    font-size:11px;text-transform:uppercase;letter-spacing:.2em;margin-top:16px;
  }
  .card-price{
    font-size:10px;text-transform:uppercase;letter-spacing:.16em;
    color:var(--mute);margin-top:8px;
  }
  .back{
    align-self:flex-start;
    background:none;border:0;padding:0;margin:0 0 28px;
    font:inherit;color:var(--mute);cursor:pointer;
    font-size:10px;text-transform:uppercase;letter-spacing:.2em;
  }
  .back:hover{color:var(--ink)}
  .back:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  [hidden]{display:none!important}
</style>
<script async crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsudXNlZ29ibGluLnh5eiQ"
  src="https://clerk.usegoblin.xyz/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
</head>
<body>
<main>
  <div class="line-name">Buried Destiny</div>
  <section id="gridView">
    <div class="grid" id="productGrid"></div>
  </section>

  <section id="detailView" hidden>
    <button class="back" id="backBtn" type="button">&larr; All products</button>

    <div class="product">
      <img id="productImg" src="" alt="">
    </div>

    <h1 id="productName"></h1>
    <div class="price" id="productPrice"></div>

    <div class="group">
      <div class="group-label">Color</div>
      <div class="opts" id="colorOpts"></div>
    </div>

    <div class="group">
      <div class="group-label">Size</div>
      <div class="opts" id="sizeOpts"></div>
    </div>

  <div class="group">
    <div class="group-label">Shipping</div>
    <form id="orderForm" action="/api/order" method="POST">
      <input type="hidden" name="product" id="fieldProduct" value="">
      <input type="hidden" name="size" id="fieldSize" value="M">
      <input type="hidden" name="color" id="fieldColor" value="Bone">
      <div class="fields">
        <input class="email-input" type="text" name="name" id="nameInput" placeholder="FULL NAME" required autocomplete="name" aria-label="Full name">
        <input class="email-input" type="text" name="address" id="addrInput" placeholder="STREET ADDRESS" required autocomplete="street-address" aria-label="Street address">
        <div class="field-row">
          <input class="email-input" type="text" name="city" id="cityInput" placeholder="CITY" required autocomplete="address-level2" aria-label="City">
          <input class="email-input" type="text" name="state" id="stateInput" placeholder="STATE / PROVINCE" required autocomplete="address-level1" aria-label="State or province">
          <input class="email-input" type="text" name="zip" id="zipInput" placeholder="ZIP / POSTCODE" required autocomplete="postal-code" aria-label="ZIP or postcode">
        </div>
        <select class="email-input country-select" name="country" id="countryInput" required autocomplete="country-name" aria-label="Country">
          <option value="" disabled selected>COUNTRY</option>
          <option>United States</option>
          <option>Canada</option>
          <option>United Kingdom</option>
          <option>Australia</option>
          <option>Nigeria</option>
          <option>Ghana</option>
          <option>South Africa</option>
          <option>Kenya</option>
          <option>France</option>
          <option>Germany</option>
          <option>Netherlands</option>
          <option>Italy</option>
          <option>Spain</option>
          <option>Portugal</option>
          <option>Ireland</option>
          <option>Sweden</option>
          <option>Norway</option>
          <option>Denmark</option>
          <option>Switzerland</option>
          <option>Belgium</option>
          <option>Austria</option>
          <option>Poland</option>
          <option>United Arab Emirates</option>
          <option>Saudi Arabia</option>
          <option>Qatar</option>
          <option>Japan</option>
          <option>South Korea</option>
          <option>China</option>
          <option>Singapore</option>
          <option>Hong Kong</option>
          <option>India</option>
          <option>Brazil</option>
          <option>Mexico</option>
          <option>Argentina</option>
          <option>New Zealand</option>
          <option>Other</option>
        </select>
      </div>
    </form>
    <div class="field-hint">Your order ships to this address</div>
  </div>

  <a class="buy" id="buyBtn" href="https://www.paypal.me/drbinna123/10">Buy — $10</a>

  <p class="note">
    Pays via PayPal. Order details are sent automatically when you buy. All sales final.
  </p>
  </section>
</main>

<script type="module">
  import { PRODUCTS, bySlug, paypalUrl } from '/catalog.js';

  const buyBtn       = document.getElementById('buyBtn');
  const img          = document.getElementById('productImg');
  const gridView     = document.getElementById('gridView');
  const detailView   = document.getElementById('detailView');
  const productGrid  = document.getElementById('productGrid');
  const productName  = document.getElementById('productName');
  const productPrice = document.getElementById('productPrice');
  const colorOpts    = document.getElementById('colorOpts');
  const sizeOpts     = document.getElementById('sizeOpts');
  const fieldProduct = document.getElementById('fieldProduct');
  const fieldSize    = document.getElementById('fieldSize');
  const fieldColor   = document.getElementById('fieldColor');

  let current = null;   // product currently on screen

  // Warm every colourway so switching is instant
  PRODUCTS.forEach(p => p.colors.forEach(c => { const i = new Image(); i.src = c.image; }));

  function renderGrid(){
    productGrid.innerHTML = '';
    PRODUCTS.forEach(p => {
      const first = p.colors[0];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      const im = document.createElement('img');
      im.src = first.image; im.alt = first.alt;
      const nm = document.createElement('span');
      nm.className = 'card-name'; nm.textContent = p.name;
      const pr = document.createElement('span');
      pr.className = 'card-price';
      pr.innerHTML = '$' + p.price_usd + ' &middot; Shipping Included';
      card.append(im, nm, pr);
      card.addEventListener('click', () => { location.hash = '#/' + p.slug; });
      productGrid.appendChild(card);
    });
  }

  function optButton(label, pressed){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    b.textContent = label;
    return b;
  }

  function press(group, btn){
    group.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
  }

  function selectColor(c, btn){
    img.src = c.image;
    img.alt = c.alt;
    fieldColor.value = c.label;
    press(colorOpts, btn);
  }

  function renderDetail(p){
    current = p;
    productName.textContent = p.name;
    productPrice.innerHTML  = '$' + p.price_usd + ' &nbsp;&middot;&nbsp; Shipping Included';
    fieldProduct.value      = p.slug;
    document.title          = p.name.toUpperCase() + ' \u2014 BURIED DESTINY';

    colorOpts.innerHTML = '';
    p.colors.forEach((c, i) => {
      const b = optButton(c.label, i === 0);
      b.addEventListener('click', () => selectColor(c, b));
      colorOpts.appendChild(b);
      if (i === 0) selectColor(c, b);
    });

    sizeOpts.innerHTML = '';
    const defaultSize = p.sizes.includes('M') ? 'M' : p.sizes[0];
    p.sizes.forEach(size => {
      const b = optButton(size, size === defaultSize);
      b.addEventListener('click', () => { press(sizeOpts, b); fieldSize.value = size; });
      sizeOpts.appendChild(b);
    });
    fieldSize.value = defaultSize;

    buyBtn.textContent = 'Buy \u2014 $' + p.price_usd;
    buyBtn.href = paypalUrl(p.price_usd);
  }

  function route(){
    const m = location.hash.match(/^#\/(.+)$/);
    const p = m ? bySlug(m[1]) : null;
    if (p) {
      renderDetail(p);
      gridView.hidden = true;
      detailView.hidden = false;
    } else {
      current = null;
      document.title = 'BURIED DESTINY';
      detailView.hidden = true;
      gridView.hidden = false;
    }
    window.scrollTo(0, 0);
  }

  // Clerk modal skinned to the Buried Destiny palette
  const BD = { bg:'#E7E5E1', ink:'#1a1a1a', mute:'#8f8d89' };
  const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  const CLERK_LOOK = {
    layout: { socialButtonsVariant: 'blockButton', showOptionalFields: false },
    variables: {
      colorBackground: BD.bg,
      colorPrimary: BD.ink,
      colorText: BD.ink,
      colorTextSecondary: BD.mute,
      colorInputBackground: 'transparent',
      colorInputText: BD.ink,
      colorNeutral: BD.ink,
      fontFamily: SANS,
      fontSize: '12px',
      borderRadius: '0px'
    },
    elements: {
      card: { backgroundColor: BD.bg, boxShadow: 'none', border: '1px solid ' + BD.ink, borderRadius: '0' },
      modalContent: { borderRadius: '0' },
      logoBox: { display: 'none' },
      headerTitle: {
        fontFamily: SANS, fontSize: '12px', fontWeight: '400',
        letterSpacing: '.34em', textTransform: 'uppercase', color: BD.ink
      },
      headerSubtitle: {
        fontSize: '10px', letterSpacing: '.14em', textTransform: 'uppercase', color: BD.mute
      },
      socialButtonsBlockButton: {
        border: '1px solid ' + BD.ink, borderRadius: '0', backgroundColor: 'transparent',
        color: BD.ink, height: '44px',
        '&:hover': { backgroundColor: BD.ink, color: BD.bg }
      },
      socialButtonsBlockButtonText: {
        fontSize: '11px', letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: '400'
      },
      dividerLine: { backgroundColor: BD.mute },
      dividerText: { fontSize: '9px', letterSpacing: '.2em', textTransform: 'uppercase', color: BD.mute },
      formFieldLabel: { fontSize: '9px', letterSpacing: '.2em', textTransform: 'uppercase', color: BD.mute },
      formFieldInput: {
        borderRadius: '0', border: '1px solid ' + BD.ink, backgroundColor: 'transparent',
        fontSize: '11px', letterSpacing: '.12em', height: '44px', color: BD.ink
      },
      formButtonPrimary: {
        borderRadius: '0', backgroundColor: BD.ink, color: BD.bg, height: '44px',
        fontSize: '11px', letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: '400',
        boxShadow: 'none', '&:hover': { backgroundColor: '#000' }
      },
      footer: { background: BD.bg, borderTop: '1px solid rgba(26,26,26,.12)' },
      footerAction: { background: BD.bg },
      footerActionText: { fontSize: '9px', letterSpacing: '.14em', textTransform: 'uppercase', color: BD.mute },
      footerActionLink: {
        fontSize: '9px', letterSpacing: '.14em', textTransform: 'uppercase',
        color: BD.ink, textDecoration: 'underline'
      },
      identityPreview: { borderRadius: '0', border: '1px solid ' + BD.mute, backgroundColor: 'transparent' },
      modalCloseButton: { color: BD.ink },
      badge: { display: 'none' }
    }
  };
  const CLERK_COPY = {
    signIn:  { start: { title: 'Buried Destiny', subtitle: 'Sign in to complete your order' } },
    signUp:  { start: { title: 'Buried Destiny', subtitle: 'Create an account to complete your order' } }
  };

  // Buy flow: validate form -> Clerk auth -> save order -> PayPal.
  // Google auth navigates away from the page, so the order is stashed first
  // and replayed the moment we land back here signed in.
  const RETURN_URL = location.origin + '/?checkout=1';
  const STASH_KEY  = 'bd_pending_order';
  const orderForm = document.getElementById('orderForm');
  let clerkReady = false;

  function showHandoff(){
    const o = document.createElement('div');
    o.setAttribute('style',
      'position:fixed;inset:0;z-index:9999;background:#E7E5E1;color:#1a1a1a;' +
      'display:flex;align-items:center;justify-content:center;' +
      'font:400 11px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase');
    o.textContent = 'Redirecting to PayPal';
    document.body.appendChild(o);
  }

  function collectPayload(){
    return Object.fromEntries(new FormData(orderForm).entries());
  }

  function withClerkIdentity(payload){
    const u = window.Clerk && window.Clerk.user;
    if (u) {
      payload.email = (u.primaryEmailAddress && u.primaryEmailAddress.emailAddress) || payload.email || '';
      payload.clerk_user_id = u.id;
      if (!payload.name || !payload.name.trim()) payload.name = u.fullName || payload.name;
    }
    return payload;
  }

  async function sendOrderAndPay(payload){
    showHandoff();
    try {
      await fetch('/api/order', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(withClerkIdentity(payload)),
        keepalive:true
      });
    } catch(e){ console.error('Order save failed', e); }
    try { sessionStorage.removeItem(STASH_KEY); } catch(e){}
    window.location.replace(paypalUrl((current || {}).price_usd || 10));
  }

  // Landed back here after Google auth? Replay the stashed order and go straight to PayPal.
  function resumeCheckout(){
    if (new URLSearchParams(location.search).get('checkout') !== '1') return;
    history.replaceState({}, '', location.pathname);   // so a refresh can't re-fire
    if (!(window.Clerk && window.Clerk.user)) return;
    let stashed = null;
    try { stashed = JSON.parse(sessionStorage.getItem(STASH_KEY) || 'null'); } catch(e){}
    if (!stashed) return;
    sendOrderAndPay(stashed);
  }

  (function initClerk(){
    let tries = 0;
    const tryLoad = async () => {
      if (window.Clerk) {
        try {
          await window.Clerk.load({ appearance: CLERK_LOOK, localization: CLERK_COPY });
          clerkReady = true;
          resumeCheckout();
        } catch(e){ console.error('Clerk failed to load', e); }
      } else if (tries++ < 50) {
        setTimeout(tryLoad, 200);
      }
    };
    tryLoad();
  })();

  renderGrid();
  window.addEventListener('hashchange', route);
  document.getElementById('backBtn')
          .addEventListener('click', () => { location.hash = ''; });
  route();

  buyBtn.addEventListener('click', function(ev){
    ev.preventDefault();
    if(!orderForm.checkValidity()){
      orderForm.reportValidity();
      return;
    }
    const payload = collectPayload();

    if (clerkReady && window.Clerk.user) {      // already signed in
      sendOrderAndPay(payload);
      return;
    }

    if (clerkReady) {
      try { sessionStorage.setItem(STASH_KEY, JSON.stringify(payload)); } catch(e){}

      // In-modal auth (email/password) finishes without navigating; handle that too.
      const unsub = window.Clerk.addListener(function(state){
        if (state.user) {
          unsub();
          try { window.Clerk.closeSignIn(); } catch(e){}
          sendOrderAndPay(payload);
        }
      });

      window.Clerk.openSignIn({
        appearance: CLERK_LOOK,
        forceRedirectUrl: RETURN_URL,
        signUpForceRedirectUrl: RETURN_URL,
        fallbackRedirectUrl: RETURN_URL,
        signUpFallbackRedirectUrl: RETURN_URL
      });
    } else {
      // Clerk unavailable -- never lose the sale
      sendOrderAndPay(payload);
    }
  });
</script>
</body>
</html>
