<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BURIED DESTINY</title>
<meta name="description" content="Buried Destiny. Zip hoodie. $10 shipped.">
<style>
  :root{
    --bg:#E7E5E1;
    --ink:#1a1a1a;
    --mute:#8f8d89;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    letter-spacing:.12em;
    -webkit-font-smoothing:antialiased;
  }
  .line-name{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.34em;
    margin-bottom:40px;
    color:var(--ink);
  }
  main{
    width:100%;
    max-width:640px;
    padding:48px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .product{
    width:100%;
  }
  .product img{
    width:100%;
    display:block;
    mix-blend-mode:multiply;
  }
  h1{
    font-size:12px;
    font-weight:400;
    text-transform:uppercase;
    margin-top:36px;
  }
  .price{
    font-size:12px;
    color:var(--mute);
    text-transform:uppercase;
    margin-top:10px;
  }
  .group{
    margin-top:34px;
    width:100%;
  }
  .group-label{
    font-size:10px;
    color:var(--mute);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .opts{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .opt{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    background:transparent;
    color:var(--ink);
    border:1px solid transparent;
    padding:12px 18px;
    min-width:56px;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;
  }
  .opt:hover{border-color:var(--ink)}
  .opt[aria-pressed="true"]{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .opt:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .email-input{
    width:100%;
    max-width:420px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink);
    padding:16px 18px;
    text-align:center;
    outline:none;
  }
  .email-input::placeholder{color:var(--mute)}
  .email-input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .fields{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .field-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:420px;
  }
  .field-row .email-input{min-width:0;flex:1}
  .country-select{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%231a1a1a'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  .country-select:invalid{color:var(--mute)}
  .field-hint{
    font-size:9px;
    color:var(--mute);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:10px;
  }
  .buy{
    display:block;
    width:100%;
    margin-top:44px;
    padding:20px;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bg);
    background:var(--ink);
    transition:opacity .15s;
  }
  .buy:hover{opacity:.85}
  .buy:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .note{
    margin-top:22px;
    font-size:10px;
    line-height:2;
    color:var(--mute);
    text-transform:uppercase;
    max-width:420px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
  }
</style>
</head>

  const ALTS = {
    bone: "Zip hoodie, bone colorway",
    black: "Zip hoodie, black colorway"
  };
  const img = document.getElementById('productImg');

  function wireGroup(id, onSelect){
    const group = document.getElementById(id);
    group.addEventListener('click', e=>{
      const btn = e.target.closest('.opt');
      if(!btn) return;
      group.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      if(onSelect) onSelect(btn);
    });
  }
  wireGroup('colorOpts', btn=>{
    const c = btn.dataset.color;
    img.src = IMAGES[c];
    img.alt = ALTS[c];
  });
  wireGroup('sizeOpts');

  // Submit the email capture in the background when Buy is clicked
  const buyBtn = document.getElementById('buyBtn');
  const emailForm = document.getElementById('emailForm');
  const emailInput = document.getElementById('emailInput');
  buyBtn.addEventListener('click', function(){
    if(emailInput.value && emailInput.checkValidity()){
      const data = new FormData(emailForm);
      navigator.sendBeacon ?
        fetch(emailForm.action, {method:'POST', body:data, mode:'no-cors', keepalive:true}) :
        null;
    }
  });
</script>
