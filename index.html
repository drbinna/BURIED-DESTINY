<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BURIED DESTINY</title>
<meta name="description" content="Buried Destiny. Zip hoodie. $10 shipped.">
<style>
  :root{
    --bg:#E7E5E1;
    --ink:#1a1a1a;
    --mute:#8f8d89;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    letter-spacing:.12em;
    -webkit-font-smoothing:antialiased;
  }
  .line-name{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.34em;
    margin-bottom:40px;
    color:var(--ink);
  }
  main{
    width:100%;
    max-width:640px;
    padding:48px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .product{
    width:100%;
  }
  .product img{
    width:100%;
    display:block;
    mix-blend-mode:multiply;
  }
  h1{
    font-size:12px;
    font-weight:400;
    text-transform:uppercase;
    margin-top:36px;
  }
  .price{
    font-size:12px;
    color:var(--mute);
    text-transform:uppercase;
    margin-top:10px;
  }
  .group{
    margin-top:34px;
    width:100%;
  }
  .group-label{
    font-size:10px;
    color:var(--mute);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .opts{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .opt{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    background:transparent;
    color:var(--ink);
    border:1px solid transparent;
    padding:12px 18px;
    min-width:56px;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;
  }
  .opt:hover{border-color:var(--ink)}
  .opt[aria-pressed="true"]{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .opt:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .email-input{
    width:100%;
    max-width:420px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink);
    padding:16px 18px;
    text-align:center;
    outline:none;
  }
  .email-input::placeholder{color:var(--mute)}
  .email-input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .fields{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .field-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:420px;
  }
  .field-row .email-input{min-width:0;flex:1}
  .country-select{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%231a1a1a'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  .country-select:invalid{color:var(--mute)}
  .field-hint{
    font-size:9px;
    color:var(--mute);
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:10px;
  }
  .buy{
    display:block;
    width:100%;
    margin-top:44px;
    padding:20px;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bg);
    background:var(--ink);
    transition:opacity .15s;
  }
  .buy:hover{opacity:.85}
  .buy:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .note{
    margin-top:22px;
    font-size:10px;
    line-height:2;
    color:var(--mute);
    text-transform:uppercase;
    max-width:420px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
  }
</style>
<script async crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsudXNlZ29ibGluLnh5eiQ"
  src="https://clerk.usegoblin.xyz/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
</head>
<body>
<main>
  <div class="line-name">Buried Destiny</div>
  <div class="product">
    <img id="productImg"
         src="/img/bone.jpg"
         alt="Zip hoodie, bone colorway">
  </div>

  <h1>Zip Hoodie</h1>
  <div class="price">$10 &nbsp;·&nbsp; Shipping Included</div>

  <div class="group">
    <div class="group-label">Color</div>
    <div class="opts" id="colorOpts">
      <button class="opt" aria-pressed="true" data-color="bone">Bone</button>
      <button class="opt" aria-pressed="false" data-color="black">Black</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Size</div>
    <div class="opts" id="sizeOpts">
      <button class="opt" aria-pressed="false">S</button>
      <button class="opt" aria-pressed="true">M</button>
      <button class="opt" aria-pressed="false">L</button>
      <button class="opt" aria-pressed="false">XL</button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Shipping</div>
    <form id="orderForm" action="/api/order" method="POST">
      <input type="hidden" name="size" id="fieldSize" value="M">
      <input type="hidden" name="color" id="fieldColor" value="Bone">
      <div class="fields">
        <input class="email-input" type="text" name="name" id="nameInput" placeholder="FULL NAME" required autocomplete="name" aria-label="Full name">
        <input class="email-input" type="text" name="address" id="addrInput" placeholder="STREET ADDRESS" required autocomplete="street-address" aria-label="Street address">
        <div class="field-row">
          <input class="email-input" type="text" name="city" id="cityInput" placeholder="CITY" required autocomplete="address-level2" aria-label="City">
          <input class="email-input" type="text" name="state" id="stateInput" placeholder="STATE / PROVINCE" required autocomplete="address-level1" aria-label="State or province">
          <input class="email-input" type="text" name="zip" id="zipInput" placeholder="ZIP / POSTCODE" required autocomplete="postal-code" aria-label="ZIP or postcode">
        </div>
        <select class="email-input country-select" name="country" id="countryInput" required autocomplete="country-name" aria-label="Country">
          <option value="" disabled selected>COUNTRY</option>
          <option>United States</option>
          <option>Canada</option>
          <option>United Kingdom</option>
          <option>Australia</option>
          <option>Nigeria</option>
          <option>Ghana</option>
          <option>South Africa</option>
          <option>Kenya</option>
          <option>France</option>
          <option>Germany</option>
          <option>Netherlands</option>
          <option>Italy</option>
          <option>Spain</option>
          <option>Portugal</option>
          <option>Ireland</option>
          <option>Sweden</option>
          <option>Norway</option>
          <option>Denmark</option>
          <option>Switzerland</option>
          <option>Belgium</option>
          <option>Austria</option>
          <option>Poland</option>
          <option>United Arab Emirates</option>
          <option>Saudi Arabia</option>
          <option>Qatar</option>
          <option>Japan</option>
          <option>South Korea</option>
          <option>China</option>
          <option>Singapore</option>
          <option>Hong Kong</option>
          <option>India</option>
          <option>Brazil</option>
          <option>Mexico</option>
          <option>Argentina</option>
          <option>New Zealand</option>
          <option>Other</option>
        </select>
      </div>
    </form>
    <div class="field-hint">Your order ships to this address</div>
  </div>

  <a class="buy" id="buyBtn" href="https://www.paypal.me/drbinna123/10">Buy — $10</a>

  <p class="note">
    Pays via PayPal. Order details are sent automatically when you buy. All sales final.
  </p>
</main>

<script>
  const IMAGES = {
    bone: "/img/bone.jpg",
    black: "/img/black.jpg"
  };
  const ALTS = {
    bone: "Zip hoodie, bone colorway",
    black: "Zip hoodie, black colorway"
  };
  const img = document.getElementById('productImg');

  function wireGroup(id, onSelect){
    const group = document.getElementById(id);
    group.addEventListener('click', e=>{
      const btn = e.target.closest('.opt');
      if(!btn) return;
      group.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      if(onSelect) onSelect(btn);
    });
  }
  // Warm the cache for both colourways so switching is instant
  Object.values(IMAGES).forEach(src => { const p = new Image(); p.src = src; });

  wireGroup('colorOpts', btn=>{
    const c = btn.dataset.color;
    img.src = IMAGES[c];
    img.alt = ALTS[c];
  });
  wireGroup('sizeOpts');

  // Keep hidden size/color fields in sync with the selectors
  const fieldSize = document.getElementById('fieldSize');
  const fieldColor = document.getElementById('fieldColor');
  document.getElementById('sizeOpts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(b) fieldSize.value = b.textContent.trim();
  });
  document.getElementById('colorOpts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(b) fieldColor.value = b.textContent.trim();
  });

  // Clerk modal skinned to the Buried Destiny palette
  const BD = { bg:'#E7E5E1', ink:'#1a1a1a', mute:'#8f8d89' };
  const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  const CLERK_LOOK = {
    layout: { socialButtonsVariant: 'blockButton', showOptionalFields: false },
    variables: {
      colorBackground: BD.bg,
      colorPrimary: BD.ink,
      colorText: BD.ink,
      colorTextSecondary: BD.mute,
      colorInputBackground: 'transparent',
      colorInputText: BD.ink,
      colorNeutral: BD.ink,
      fontFamily: SANS,
      fontSize: '12px',
      borderRadius: '0px'
    },
    elements: {
      card: { backgroundColor: BD.bg, boxShadow: 'none', border: '1px solid ' + BD.ink, borderRadius: '0' },
      modalContent: { borderRadius: '0' },
      logoBox: { display: 'none' },
      headerTitle: {
        fontFamily: SANS, fontSize: '12px', fontWeight: '400',
        letterSpacing: '.34em', textTransform: 'uppercase', color: BD.ink
      },
      headerSubtitle: {
        fontSize: '10px', letterSpacing: '.14em', textTransform: 'uppercase', color: BD.mute
      },
      socialButtonsBlockButton: {
        border: '1px solid ' + BD.ink, borderRadius: '0', backgroundColor: 'transparent',
        color: BD.ink, height: '44px',
        '&:hover': { backgroundColor: BD.ink, color: BD.bg }
      },
      socialButtonsBlockButtonText: {
        fontSize: '11px', letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: '400'
      },
      dividerLine: { backgroundColor: BD.mute },
      dividerText: { fontSize: '9px', letterSpacing: '.2em', textTransform: 'uppercase', color: BD.mute },
      formFieldLabel: { fontSize: '9px', letterSpacing: '.2em', textTransform: 'uppercase', color: BD.mute },
      formFieldInput: {
        borderRadius: '0', border: '1px solid ' + BD.ink, backgroundColor: 'transparent',
        fontSize: '11px', letterSpacing: '.12em', height: '44px', color: BD.ink
      },
      formButtonPrimary: {
        borderRadius: '0', backgroundColor: BD.ink, color: BD.bg, height: '44px',
        fontSize: '11px', letterSpacing: '.14em', textTransform: 'uppercase', fontWeight: '400',
        boxShadow: 'none', '&:hover': { backgroundColor: '#000' }
      },
      footer: { background: BD.bg, borderTop: '1px solid rgba(26,26,26,.12)' },
      footerAction: { background: BD.bg },
      footerActionText: { fontSize: '9px', letterSpacing: '.14em', textTransform: 'uppercase', color: BD.mute },
      footerActionLink: {
        fontSize: '9px', letterSpacing: '.14em', textTransform: 'uppercase',
        color: BD.ink, textDecoration: 'underline'
      },
      identityPreview: { borderRadius: '0', border: '1px solid ' + BD.mute, backgroundColor: 'transparent' },
      modalCloseButton: { color: BD.ink },
      badge: { display: 'none' }
    }
  };
  const CLERK_COPY = {
    signIn:  { start: { title: 'Buried Destiny', subtitle: 'Sign in to complete your order' } },
    signUp:  { start: { title: 'Buried Destiny', subtitle: 'Create an account to complete your order' } }
  };

  // Buy flow: validate shipping form -> Clerk sign-in modal -> save order -> PayPal
  const PAYPAL_URL = 'https://www.paypal.me/drbinna123/10';
  const buyBtn = document.getElementById('buyBtn');
  const orderForm = document.getElementById('orderForm');
  let clerkReady = false;

  (function initClerk(){
    let tries = 0;
    const tryLoad = async () => {
      if (window.Clerk) {
        try { await window.Clerk.load({ appearance: CLERK_LOOK, localization: CLERK_COPY }); clerkReady = true; }
        catch(e){ console.error('Clerk failed to load', e); }
      } else if (tries++ < 50) {
        setTimeout(tryLoad, 200);
      }
    };
    tryLoad();
  })();

  async function submitOrderAndPay(){
    const payload = Object.fromEntries(new FormData(orderForm).entries());
    const u = window.Clerk && window.Clerk.user;
    if (u) {
      payload.email = (u.primaryEmailAddress && u.primaryEmailAddress.emailAddress) || '';
      payload.clerk_user_id = u.id;
      if (!payload.name || !payload.name.trim()) payload.name = u.fullName || payload.name;
    }
    try {
      await fetch('/api/order', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
        keepalive:true
      });
    } catch(e){ console.error('Order save failed', e); }
    window.location.href = PAYPAL_URL;
  }

  buyBtn.addEventListener('click', function(ev){
    ev.preventDefault();
    if(!orderForm.checkValidity()){
      orderForm.reportValidity();
      return;
    }
    if (clerkReady && window.Clerk.user) {
      submitOrderAndPay();
      return;
    }
    if (clerkReady) {
      const unsub = window.Clerk.addListener(function(state){
        if (state.user) {
          unsub();
          try { window.Clerk.closeSignIn(); } catch(e){}
          submitOrderAndPay();
        }
      });
      window.Clerk.openSignIn({ appearance: CLERK_LOOK });
    } else {
      // Clerk unavailable -- do not lose the sale; save with form data only and continue
      submitOrderAndPay();
    }
  });
</script>
</body>
</html>
